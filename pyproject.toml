[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phitribrain369"
version = "0.1.0"
description = "Local-first three-brain knowledge ledger for people and AI agents"
requires-python = ">=3.10"
license = "MIT"
readme = "README.md"
authors = [{name = "Phi369 Labs"}]
dependencies = []

[project.scripts]
phitribrain = "phitribrain.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
